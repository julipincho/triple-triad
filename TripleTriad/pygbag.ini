[DEPENDENCIES]
# Lo que no debe viajar a la build web.
#
# OJO con ignoreDirs: pygbag compara la carpeta con Path.match() y con
# startswith("<patron>/"). Un patron SIN barra inicial ("gravedad") solo
# bloquea la carpeta de primer nivel, no sus subcarpetas: por eso
# gravedad/frames/ se colaba en el paquete (8,9 MB de PNG). Hay que escribir
# la ruta con "/", p.ej. "/gravedad".
#
# Los .wav se quitan porque en la web se carga el .ogg equivalente (ver
# audio.py: es_web()) y entre ambos el paquete baja de 14 MB a ~4 MB.
ignoreDirs = ["/tests","/auditoria","/recorrido","/gravedad","/gravedad_fg","/build","/dist","/.git","/.opencode","/__pycache__"]
ignoreFiles = ["build_pygbag.log","build_pygbag2.log","build_pygbag3.log","build_pygbag4.log","crash.log","screenshot_fase1.png","test_capture.png","Figma_Proposal.md","UI_AUDIT.md","HANDOFF_WEB_ITCHIO.md","revisar_con_gemini.py","grabar_gameplay.py","grabar_gameplay_clean.py","grabar_gameplay_foreground.py","grabar_gameplay_foreground2.py","grabar_gameplay_forever.py","automatizar.py","asyncificar.py","TripleTriad.spec","crear_sonidos.py","plantilla_index.tmpl",
 "place.wav","capture.wav","chain.wav","win.wav","lose.wav","menu.wav","menu_move.wav","menu_ok.wav","menu_back.wav","card.wav","drag.wav","invalid.wav","cinema.wav","reward.wav","boss.wav",
 "musica_humano.wav","musica_orco.wav","musica_goblin.wav","musica_elfo.wav","musica_hombre_lobo.wav","musica_vampiro.wav","musica_dragon.wav","musica_duelo.wav","musica_explora.wav"]
